plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wenotes.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wenotes.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main.assets.srcDir(rootProject.file('updates'))
    }

    testOptions.unitTests.all {
        systemProperty 'wenotes.updateConfig', rootProject.file('updates/compatibility.json').absolutePath
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.12.0'
    testImplementation 'junit:junit:4.13.2'
    // Use Android's JSON behavior in JVM tests (including duplicate-key handling).
    testImplementation 'com.vaadin.external.google:android-json:0.0.20131108.vaadin1'
}
